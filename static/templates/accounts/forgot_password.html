{% extends "base.html" %}
{% block title %}Forgot Password{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><i class="bi bi-diagram-3-fill fs-3 text-primary"></i> Rover Traveller</div>
    <p class="text-muted small mb-4">Reset your password</p>
    {% if messages %}
      {% for message in messages %}
        <div class="alert alert-{{ message.tags|default:'info' }} py-2">{{ message }}</div>
      {% endfor %}
    {% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Registered Email</label>
        {{ form.email }}
      </div>
      <button type="submit" class="btn btn-primary w-100">Send Reset Link</button>
    </form>
    <p class="small text-center mt-3"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
  </div>
</div>
{% endblock %}
