{% extends "base.html" %}
{% block title %}Reset Password{% endblock %}
{% block auth_content %}
<div class="auth-wrapper">
  <div class="auth-card">
    <div class="auth-brand"><i class="bi bi-diagram-3-fill fs-3 text-primary"></i> Rover Traveller</div>
    <p class="text-muted small mb-4">Set a new password</p>
    {% if form.non_field_errors %}<div class="alert alert-danger py-2">{{ form.non_field_errors.0 }}</div>{% endif %}
    <form method="post" novalidate>
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">New Password</label>
        {{ form.new_password1 }}
      </div>
      <div class="mb-3">
        <label class="form-label">Confirm Password</label>
        {{ form.new_password2 }}
      </div>
      <button type="submit" class="btn btn-primary w-100">Reset Password</button>
    </form>
  </div>
</div>
{% endblock %}
