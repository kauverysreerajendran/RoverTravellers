{% extends "base.html" %}
{% block title %}Not found{% endblock %}
{% block content %}
<div class="section-card text-center py-5">
  <div class="fs-1 mb-2"><i class="bi bi-compass text-muted"></i></div>
  <h5 class="mb-2">Nothing here</h5>
  <p class="text-muted mb-4">
    {% if exception %}{{ exception }}{% else %}That page does not exist.{% endif %}
  </p>
  <div class="d-flex justify-content-center gap-2">
    <a href="{% url 'dashboard:overview' %}" class="btn btn-primary btn-sm">
      <i class="bi bi-house me-1"></i> Dashboard
    </a>
    <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-toggle="modal" data-bs-target="#locateModal">
      <i class="bi bi-geo-alt me-1"></i> Locate a batch
    </button>
  </div>
</div>
{% endblock %}
