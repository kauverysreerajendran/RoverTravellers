# Render Blueprint for Rover (web app + sales mobile API).
# Render wires DATABASE_URL from the database itself and generates the secrets,
# so no credential is ever written in this file.

databases:
  - name: rover-db
    plan: free
    region: singapore
    postgresMajorVersion: "16"

services:
  - type: web
    name: rover-traveller
    runtime: python
    plan: free
    region: singapore
    branch: main
    buildCommand: >-
      pip install -r requirements.txt &&
      python manage.py collectstatic --noinput &&
      python manage.py migrate --noinput &&
      python manage.py seed_sales_masters &&
      (python manage.py createsuperuser --noinput || true)
    startCommand: gunicorn config.wsgi:application --workers 2 --timeout 120
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: rover-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: TIME_ZONE
        value: Asia/Kolkata
      - key: DJANGO_SUPERUSER_USERNAME
        value: admin
      - key: DJANGO_SUPERUSER_EMAIL
        value: admin@rover.local
      - key: DJANGO_SUPERUSER_PASSWORD
        generateValue: true
